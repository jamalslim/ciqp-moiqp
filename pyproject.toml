[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "psck-moiqp"
version = "1.0.0"
description = "Mixture-of-IQP Born machines with the Pearson-Stabilized Correlation Kernel"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Jamal Slim", email = "jamal.slim@desy.de" },
    { name = "Saverio Monaco" },
    { name = "Florian Rehm" },
    { name = "Dirk Kruecker" },
    { name = "Kerstin Borras" },
]
keywords = ["quantum machine learning", "IQP circuits", "Born machine",
            "calorimeter simulation", "high-energy physics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
figures = ["matplotlib>=3.6"]
audits = ["networkx>=3.0"]

[project.urls]
Repository = "https://github.com/jamalslim/ciqp-moiqp"

[tool.setuptools.packages.find]
where = ["src"]
